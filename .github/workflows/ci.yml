name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test

      # audit-level is "critical" (not "high"): several "high" advisories currently affect only
      # transitive devDependencies of the RN/jest/eslint test toolchain (never shipped to
      # production), and the upstream packages haven't published compatible patched majors yet
      # (forcing them breaks eslint/jest outright). Revisit once those toolchains catch up.
      - run: pnpm audit --audit-level=critical
